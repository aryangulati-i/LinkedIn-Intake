<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>LinkedIn Engagement Intake | Aryan Gulati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F3F5F4;
  --surface: #FFFFFF;
  --ink: #18202E;
  --muted: #586273;
  --rule: #D8DDE2;
  --blue: #1D3F8F;
  --blue-ink: #FFFFFF;
  --blue-soft: #E3E9F5;
  --sepia: #8A5936;
  --serif: "Spectral", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1526; --surface: #142038; --ink: #E7EBF2; --muted: #A2ADBF;
    --rule: #28365A; --blue: #8FB0FF; --blue-ink: #0D1526; --blue-soft: #1B2A50; --sepia: #D8A77E;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1526; --surface: #142038; --ink: #E7EBF2; --muted: #A2ADBF;
  --rule: #28365A; --blue: #8FB0FF; --blue-ink: #0D1526; --blue-soft: #1B2A50; --sepia: #D8A77E;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.55;
}
img { max-width: 100%; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 17rem minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto;
  border-right: 1px solid var(--rule); padding: 2rem 1.25rem 2rem 1.75rem;
}
.rail-name { font-family: var(--serif); font-size: 1.15rem; font-weight: 500; margin: 0; }
.rail-role { color: var(--muted); font-size: .85rem; margin: .15rem 0 1.75rem; }
.rail ol { list-style: none; margin: 0; padding: 0; }
.rail li + li { margin-top: .15rem; }
.rail button {
  width: 100%; display: grid; grid-template-columns: 1.6rem 1fr auto; gap: .5rem; align-items: baseline;
  text-align: left; background: none; border: 0; padding: .45rem .5rem; border-radius: 4px; cursor: pointer;
  font-size: .9rem; color: var(--muted);
}
.rail button:hover { color: var(--ink); background: var(--blue-soft); }
.rail button[aria-current="step"] { color: var(--ink); font-weight: 600; background: var(--blue-soft); }
.rail .num { font-variant-numeric: tabular-nums; }
.rail .count { font-size: .75rem; font-variant-numeric: tabular-nums; }
.rail .count.full { color: var(--blue); font-weight: 600; }

/* Exposure strip: fills in cyanotype blue as answers accumulate */
.strip { display: flex; gap: 3px; margin: 1.5rem 0 .5rem; }
.strip span { flex: 1; height: 6px; background: var(--rule); border-radius: 1px; transition: background-color .4s ease; }
.strip span.lvl1 { background: color-mix(in srgb, var(--blue) 35%, var(--rule)); }
.strip span.lvl2 { background: color-mix(in srgb, var(--blue) 70%, var(--rule)); }
.strip span.lvl3 { background: var(--blue); }
.strip-label { font-size: .78rem; color: var(--muted); margin: 0; }
.saved { font-size: .78rem; color: var(--muted); margin-top: 1.25rem; }

.topbar { display: none; }
main { padding: 3.5rem clamp(1.25rem, 5vw, 4rem) 5rem; }
.col { max-width: 42rem; }

.intro h1 {
  font-family: var(--serif); font-weight: 400; font-size: clamp(2.3rem, 5.5vw, 3.6rem);
  line-height: 1.08; letter-spacing: -.01em; margin: 0 0 1.5rem;
}
.lede { font-family: var(--serif); font-size: 1.2rem; line-height: 1.65; margin: 0 0 1rem; }
.intro p { max-width: 38rem; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: .55rem 1.5rem; margin: 2rem 0; padding: 1.25rem 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.facts dt { color: var(--muted); font-size: .9rem; }
.facts dd { margin: 0; }
.guidance { padding-left: 1.1rem; margin: 0 0 2rem; }
.guidance li { margin: .35rem 0; }

.sec-head { margin-bottom: 2.25rem; }
.sec-kicker { color: var(--sepia); font-size: .9rem; margin: 0 0 .35rem; font-variant-numeric: tabular-nums; }
.sec-head h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(1.8rem, 4vw, 2.4rem); line-height: 1.15; margin: 0 0 .9rem; }
.sec-head p { font-family: var(--serif); font-size: 1.1rem; line-height: 1.65; color: var(--muted); margin: 0; }
.group { font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--sepia); margin: 2.75rem 0 .25rem; }

.q { padding: 1.6rem 0; border-top: 1px solid var(--rule); }
.q fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.prompt { display: grid; grid-template-columns: 2.6rem 1fr; gap: .25rem; margin-bottom: .8rem; }
.prompt .n { color: var(--muted); font-size: .85rem; padding-top: .25rem; font-variant-numeric: tabular-nums; }
.prompt .t { font-family: var(--serif); font-size: 1.14rem; line-height: 1.5; font-weight: 500; }
legend.prompt { padding: 0; width: 100%; }
.help { color: var(--muted); font-size: .9rem; margin: -.4rem 0 .8rem 2.85rem; }
.field { margin-left: 2.85rem; }

input[type="text"], input[type="url"], textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px;
  padding: .7rem .8rem; line-height: 1.5;
}
textarea { min-height: 5.2rem; resize: vertical; overflow: hidden; }
input[type="text"]:focus, input[type="url"]:focus, textarea:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-soft); }
.sub-input { margin-top: .75rem; }
.sub-label { display: block; font-size: .88rem; color: var(--muted); margin: .9rem 0 .35rem; }

.seg { display: flex; flex-wrap: wrap; gap: .45rem; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span {
  display: inline-block; padding: .5rem .9rem; border: 1px solid var(--rule); border-radius: 999px;
  background: var(--surface); font-size: .92rem; cursor: pointer; transition: background-color .15s, border-color .15s;
}
.seg input:checked + span { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }
.seg label:hover span { border-color: var(--blue); }

.checks { display: grid; gap: .1rem; }
.check-row { display: flex; align-items: center; gap: .5rem; }
.check-row label { flex: 1; display: flex; gap: .7rem; align-items: flex-start; padding: .45rem 0; cursor: pointer; }
.check-row input[type="checkbox"] { width: 1.1rem; height: 1.1rem; margin: .2rem 0 0; accent-color: var(--blue); flex: none; }
.star {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: .2rem .65rem;
  font-size: .8rem; color: var(--muted); cursor: pointer;
}
.star[aria-pressed="true"] { background: var(--sepia); border-color: var(--sepia); color: var(--surface); }
.star:disabled { opacity: .35; cursor: not-allowed; }
.hint { font-size: .85rem; color: var(--sepia); min-height: 1.2rem; margin: .4rem 0 0; }

.scale-row { padding: .9rem 0; border-bottom: 1px dashed var(--rule); }
.scale-row:last-child { border-bottom: 0; }
.scale-ends { display: flex; justify-content: space-between; gap: 1rem; font-size: .9rem; margin-bottom: .55rem; }
.scale-ends span:last-child { text-align: right; }
.dots { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4rem; }
.dots label { position: relative; }
.dots input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.dots span {
  display: block; text-align: center; padding: .45rem 0; border: 1px solid var(--rule); border-radius: 4px;
  background: var(--surface); font-size: .9rem; font-variant-numeric: tabular-nums; cursor: pointer;
}
.dots input:checked + span { background: var(--blue); color: var(--blue-ink); border-color: var(--blue); }
.dots input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }

.matrix-row { padding: .85rem 0; border-bottom: 1px dashed var(--rule); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem 1rem; align-items: center; }
.matrix-row:last-child { border-bottom: 0; }
.matrix-row legend { padding: 0; float: left; width: 100%; }
.matrix-row .ml { font-weight: 500; }
.matrix-row .md { display: block; color: var(--muted); font-size: .86rem; }
.matrix-row .seg span { padding: .35rem .75rem; font-size: .85rem; }

.nav { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  padding: .75rem 1.3rem; border-radius: 4px; border: 1px solid var(--blue);
  background: var(--blue); color: var(--blue-ink); font-weight: 500; cursor: pointer; text-decoration: none;
}
.btn:hover { filter: brightness(1.08); }
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn.quiet:hover { border-color: var(--blue); filter: none; }
.btn[hidden] { display: none; }

.review-list { list-style: none; padding: 0; margin: 0 0 2.5rem; border-top: 1px solid var(--rule); }
.review-list li { display: grid; grid-template-columns: 2rem 1fr auto; gap: .75rem; align-items: baseline; padding: .8rem 0; border-bottom: 1px solid var(--rule); }
.review-list .rn { color: var(--muted); font-variant-numeric: tabular-nums; }
.review-list button { background: none; border: 0; padding: 0; color: var(--ink); text-align: left; cursor: pointer; font-size: 1rem; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.review-list .rc { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: .75rem; margin: 1.25rem 0; }
.status { min-height: 1.4rem; font-size: .92rem; color: var(--sepia); margin: .5rem 0 0; }
.send-note { background: var(--blue-soft); border-left: 3px solid var(--blue); padding: 1rem 1.2rem; margin: 1.5rem 0; }
.send-note p { margin: .2rem 0; }
.fallback { margin-top: 1rem; }
.fallback textarea { min-height: 14rem; font-size: .85rem; overflow: auto; }
.reset { margin-top: 3rem; font-size: .88rem; color: var(--muted); }
.reset button { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .topbar {
    display: block; position: sticky; top: 0; z-index: 5; background: var(--paper);
    border-bottom: 1px solid var(--rule); padding: .7rem 1.25rem .6rem;
    padding-top: calc(.7rem + env(safe-area-inset-top, 0px)); margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  }
  .topbar-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; font-size: .85rem; }
  .topbar select { font: inherit; font-size: .85rem; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; padding: .3rem .4rem; max-width: 60%; }
  .topbar .strip { margin: .55rem 0 0; }
  main { padding-top: 2rem; }
  .field, .help { margin-left: 0; }
  .prompt { grid-template-columns: 2.3rem 1fr; }
  .matrix-row { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>

    <div class="strip" id="railStrip" aria-hidden="true"></div>

</div>

<script>
(function () {
  "use strict";

  var CONSULTANT = { name: "Aryan Gulati", email: "aryangulati05@gmail.com" };
  var STORE_KEY = "linkedin-intake-v1";

  var YMN = ["Yes", "Maybe", "No"];

  var SECTIONS = [
    { title: "About you and logistics",
      intro: "The basics, so the working rhythm is set up correctly from week one.",
      items: [
        { id: "1.1", type: "text", q: "Full name as you want it to appear publicly" },
        { id: "1.2", type: "long", q: "Current role, organisation and sector" },
        { id: "1.3", type: "long", q: "Total years of professional experience, and the two or three roles that shaped you most" },
        { id: "1.4", type: "url", q: "LinkedIn profile URL" },
        { id: "1.5", type: "long", q: "Other platforms you are active on or would consider", help: "X, Instagram, Substack, Medium, a personal website, or none." },
        { id: "1.6", type: "text", q: "City and time zone" },
        { id: "1.7", type: "choice", q: "Preferred day for our weekly call", options: ["Saturday", "Sunday", "Either works"], sub: { id: "1.7b", label: "Preferred time window" } },
        { id: "1.8", type: "choice", q: "Preferred channel for quick exchanges between calls", options: ["WhatsApp", "Email", "Slack", "Google Docs comments", "Other"] },
        { id: "1.9", type: "long", q: "Dates in the next four months when you will be unavailable", help: "Travel, leave, heavy work periods." }
      ] },
    { title: "Where your presence stands today",
      intro: "This sets a baseline, so progress at month four can be measured against something concrete rather than a feeling.",
      items: [
        { id: "2.1", type: "text", q: "Approximately how many connections and followers do you have?" },
        { id: "2.2", type: "long", q: "How often have you posted in the last 12 months, and when was your last post?" },
        { id: "2.3", type: "long", q: "Which of your past posts, if any, received a response you did not expect?", help: "Positive or negative. Paste links if you have them." },
        { id: "2.4", type: "long", q: "When you have thought about posting and then decided not to, what stopped you?" },
        { id: "2.5", type: "multi", q: "How do you currently use LinkedIn?", options: ["Reading my feed", "Commenting on others' posts", "Job search", "Hiring", "Sales or business development", "Mostly inactive"] },
        { id: "2.6", type: "long", q: "When did you last update your headline, About section and experience entries?" },
        { id: "2.7", type: "long", q: "If a senior stranger looked at your profile today, what would they conclude about you, and how far is that from the truth?" },
        { id: "2.8", type: "scale", q: "How comfortable are you being visible online?", ends: ["Very uncomfortable", "Completely at ease"], sub: { id: "2.8b", label: "What would move that number up by one?", long: true } }
      ] },
    { title: "Why now, and what success looks like",
      intro: "A presence built for a job search reads very differently from one built to attract clients or speaking invitations. This section decides which one we are building.",
      items: [
        { id: "3.1", type: "multi", stars: 2, q: "Tick every outcome that applies, then star your top two", options: ["Being considered for a next role or promotion", "Being recognised as an authority in a specific field", "Attracting clients, consulting work or partnerships", "Speaking, panel, podcast or media invitations", "Board, advisory or fellowship opportunities", "Hiring and attracting talent to my team", "Raising the profile of my organisation or cause", "Rebuilding my network after a break or relocation", "Documenting my thinking for its own sake"], sub: { id: "3.1b", label: "Anything else? Describe it here" } },
        { id: "3.2", type: "long", q: "What prompted you to take this on now rather than six months ago or six months from now?" },
        { id: "3.3", type: "long", q: "Four months from today this has worked well. What specifically has happened?", help: "Who has messaged you, what have you been invited to, what has changed?" },
        { id: "3.4", type: "long", q: "Four months from today it has gone badly. What does that look like, and what do you most want to avoid?" },
        { id: "3.5", type: "multi", q: "Which numbers matter to you?", options: ["Followers", "Post reach", "Profile views", "Inbound messages", "Invitations and opportunities", "None of these"] },
        { id: "3.6", type: "long", q: "Where do you want your professional life to be in three years, and how could LinkedIn make that more likely?" }
      ] },
    { title: "Audience",
      intro: "Content written for everyone tends to reach no one in particular. The more precisely you describe the reader, the more precisely every post can be aimed.",
      items: [
        { id: "4.1", type: "long", q: "Describe the one person you most want reading your posts", help: "Their role, seniority, sector, and what keeps them busy on a Monday morning." },
        { id: "4.2", type: "long", q: "Name up to five real people, or job titles, whose attention would change something for you" },
        { id: "4.3", type: "long", q: "Who is your secondary audience?", help: "Peers, juniors you mentor, potential hires, clients, funders, policy makers." },
        { id: "4.4", type: "long", q: "What does your primary reader already believe about your field that you think is incomplete or wrong?" },
        { id: "4.5", type: "long", q: "What problem does this reader have that you are unusually well placed to help with?" },
        { id: "4.6", type: "long", q: "Which geographies and industries should the content speak to? Are there audiences you would rather not attract?" },
        { id: "4.7", type: "long", q: "When you read LinkedIn yourself, what makes you stop scrolling, and what makes you roll your eyes?" }
      ] },
    { title: "Niche and positioning",
      intro: "A niche is rarely picked from a list. It is usually found where your experience, your convictions and a specific audience's needs overlap. Answer instinctively and refine later; this section carries the most weight.",
      items: [
        { type: "group", text: "Expertise and evidence" },
        { id: "5.1", type: "long", q: "What do colleagues, juniors or clients most often come to you for?", help: "Complete the sentence: \u201CPeople call me when\u2026\u201D" },
        { id: "5.2", type: "long", q: "What did you learn the hard way that most people in your field still learn the hard way?" },
        { id: "5.3", type: "long", q: "Which two areas of your experience rarely sit together in one person?", help: "For example, finance and design, or policy and operations." },
        { id: "5.4", type: "long", q: "Which piece of work, decision or result are you proudest of, and why does it matter beyond your organisation?" },
        { id: "5.5", type: "long", q: "Which topics could you speak about for an hour with no preparation?" },
        { type: "group", text: "Opinion and conviction" },
        { id: "5.6", type: "long", q: "Which widely accepted practice in your industry do you think is overrated, outdated or quietly harmful?" },
        { id: "5.7", type: "long", q: "What do you believe that a reasonable peer in your field would disagree with?" },
        { id: "5.8", type: "long", q: "Which conversations in your sector frustrate you because they stay at the surface? What is missing from them?" },
        { id: "5.9", type: "long", q: "If you could change one thing about how your industry works, what would it be?" },
        { type: "group", text: "Direction and boundaries" },
        { id: "5.10", type: "long", q: "In three years, how would you like to be introduced at a conference?", help: "Write the introduction in one or two sentences." },
        { id: "5.11", type: "long", q: "Which topics are you tired of being associated with, or never want to be known for?" },
        { id: "5.12", type: "long", q: "Whose career or public presence do you quietly admire, and what specifically about it?" },
        { id: "5.13", type: "long", q: "Are there personal interests, values or causes you would fold into your professional presence, or keep entirely separate?", help: "Art, parenting, mentoring, sustainability, inclusion, travel." },
        { id: "5.14", type: "long", q: "If your LinkedIn could only ever be about one subject, what would you choose?" }
      ] },
    { title: "Voice and tone",
      intro: "Every post will be drafted in your voice, so drafts need to sound like you on a good day rather than like a generic professional. This section calibrates that register.",
      items: [
        { id: "6.1", type: "sliders", q: "Where does your natural voice sit between each pair?", help: "1 leans fully left, 5 fully right.", rows: [["Formal and measured", "Conversational and relaxed"], ["Analytical and data-led", "Story-led and personal"], ["Reserved about personal life", "Open about personal life"], ["Diplomatic, avoids controversy", "Direct, takes a position"], ["Serious throughout", "Uses humour and warmth"], ["Teaches and explains", "Questions and provokes"], ["Polished and edited", "Raw and in-the-moment"]] },
        { id: "6.2", type: "long", q: "Name two or three people whose writing you enjoy. What do they do that you would like to borrow?" },
        { id: "6.3", type: "long", q: "What kind of LinkedIn post makes you cringe?", help: "Be specific about the habits you never want to see in your own feed." },
        { id: "6.4", type: "matrix", q: "How much personal material are you comfortable sharing?", cols: ["Yes", "Sometimes", "Never"], rows: [{ l: "Career setbacks and failures" }, { l: "Family" }, { l: "Health" }, { l: "Identity" }, { l: "Money" }, { l: "Politics" }] },
        { id: "6.5", type: "long", q: "Are there words, phrases or buzzwords you want banned from your drafts?" },
        { id: "6.6", type: "matrix", q: "Language and style preferences", cols: null, rows: [{ l: "Spelling", opts: ["British", "American", "No preference"] }, { l: "Emojis", opts: ["Never", "Sparingly", "Freely"] }, { l: "Hashtags", opts: ["None", "Two or three", "No preference"] }], sub: { id: "6.6b", label: "Any use of Hindi or other languages you would like in posts?" } },
        { id: "6.7", type: "long", q: "Paste or link one or two things you have written that sound most like you", help: "An email, a speech, a report, a message." },
        { id: "6.8", type: "text", q: "Three words you would like readers to use about your presence after four months" }
      ] },
    { title: "Formats and capacity",
      intro: "The calendar has to fit the time you actually have. Two strong posts a week sustained for four months will outperform an ambitious plan abandoned in week three.",
      items: [
        { id: "7.1", type: "matrix", q: "Which formats are you open to?", cols: YMN, rows: [
          { l: "Text posts", d: "Short written posts, the core of most calendars" },

      });
    });

    copyBtn.addEventListener("click", function () {
      var text = buildExport();
      var done = function () { status.textContent = "Copied. Paste into an email to " + CONSULTANT.email + "."; };
      var fallback = function () {
        var ta = showFallback();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        status.textContent = ok ? "Copied. Paste into an email to " + CONSULTANT.email + "." : "Select the text below and copy it manually.";
        ta.select();
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
        else fallback();
      } catch (e) { fallback(); }
    });

    showBtn.addEventListener("click", function () { showFallback(); status.textContent = "Your answers are shown below."; });

    col.appendChild(h("div", { class: "send-note" },
      h("p", null, h("strong", { text: "How to send: " }), "download or copy your answers, then email them to " + CONSULTANT.name + "."),
      h("p", null, h("a", { href: "mailto:" + CONSULTANT.email + "?subject=" + encodeURIComponent("LinkedIn intake: " + clientName()) }, CONSULTANT.email))));
    col.appendChild(h("div", { class: "actions" }, dlBtn, copyBtn, showBtn));
    col.appendChild(status);
    col.appendChild(fallbackWrap);

    dlBtn.hidden = false;
    if (downloadsNs) {}
    else if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("downloads").then(function (ns) { downloadsNs = ns; }).catch(function () {});
    }

    var resetArmed = false;
    var resetBtn = h("button", { type: "button" }, "Clear all my answers");
    resetBtn.addEventListener("click", function () {
      if (!resetArmed) { resetArmed = true; resetBtn.textContent = "Click again to permanently clear every answer on this device"; return; }
      answers = {};
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      go(0);
    });
    col.appendChild(h("p", { class: "reset" }, resetBtn));

    col.appendChild(h("div", { class: "nav" },
      h("button", { type: "button", class: "btn quiet", onclick: function () { go(SECTIONS.length); } }, "Previous section"),
      h("span")));
    return col;
  }

  // ---------- progress + navigation ----------
  var railList = document.getElementById("railList");
  var topSelect = document.getElementById("topSelect");

  function buildNav() {
    railList.innerHTML = "";
    topSelect.innerHTML = "";
    var entries = [{ label: "Introduction", n: "" }].concat(SECTIONS.map(function (s, i) { return { label: s.title, n: String(i + 1) }; }), [{ label: "Review and send", n: "" }]);
    entries.forEach(function (e, idx) {
      var count = h("span", { class: "count" });
      var b = h("button", { type: "button", "data-step": idx, onclick: function () { go(idx); } },
        h("span", { class: "num", text: e.n }), h("span", { text: e.label }), count);
      railList.appendChild(h("li", null, b));
      topSelect.appendChild(h("option", { value: String(idx), text: (e.n ? e.n + ". " : "") + e.label }));
    });
    topSelect.addEventListener("change", function () { go(Number(topSelect.value)); });
  }

  function refreshProgress() {
    var btns = railList.querySelectorAll("button");
    var totalDone = 0, total = 0;
    var levels = SECTIONS.map(function (sec, i) {
      var c = sectionCount(sec);
      totalDone += c.done; total += c.total;
      var cnt = btns[i + 1] && btns[i + 1].querySelector(".count");
      if (cnt) { cnt.textContent = c.done + "/" + c.total; cnt.className = "count" + (c.done === c.total ? " full" : ""); }
      var r = c.done / c.total;
      return r === 0 ? "" : r < 0.4 ? "lvl1" : r < 1 ? "lvl2" : "lvl3";
    });
    ["railStrip", "topStrip"].forEach(function (id) {
      var s = document.getElementById(id);
      if (s.children.length !== SECTIONS.length) { s.innerHTML = ""; SECTIONS.forEach(function () { s.appendChild(h("span")); }); }
      levels.forEach(function (l, i) { s.children[i].className = l; });
    });
    document.getElementById("railStripLabel").textContent = totalDone + " of " + total + " questions answered";
  }

  function go(n) {
    step = Math.max(0, Math.min(REVIEW, n));
    persist();
    main.innerHTML = "";
    if (step === 0) main.appendChild(renderIntro());
    else if (step === REVIEW) main.appendChild(renderReview());
    else main.appendChild(renderSection(step));
    railList.querySelectorAll("button").forEach(function (b) {
      if (Number(b.getAttribute("data-step")) === step) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    topSelect.value = String(step);
    document.getElementById("topLabel").textContent = step === 0 ? "Introduction" : step === REVIEW ? "Review and send" : "Section " + step + " of " + SECTIONS.length;
    refreshProgress();
    try { window.scrollTo(0, 0); } catch (e) {}
    main.focus({ preventScroll: true });
  }

  buildNav();
  updateSavedNote();
  go(step);

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(function (ns) {
      downloadsNs = ns;
      if (ns && step === REVIEW) go(REVIEW);
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
